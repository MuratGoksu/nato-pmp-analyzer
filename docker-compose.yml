version: '3.8'

services:
  nato-pmp-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: nato-pmp-analyzer:latest
    container_name: nato-pmp-analyzer
    restart: unless-stopped

    ports:
      - "8501:8501"

    environment:
      # Load from .env file or set here
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}

      # Optional: Email configuration
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}

    volumes:
      # Persist vector database
      - chroma_data:/app/chroma_db
      # Persist processed documents metadata
      - processed_data:/app/data
      # Optional: Mount local documents for testing
      # - ./test_documents:/app/test_documents:ro

    networks:
      - nato-pmp-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  chroma_data:
    driver: local
  processed_data:
    driver: local

networks:
  nato-pmp-network:
    driver: bridge
